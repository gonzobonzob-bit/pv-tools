name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No install step - these tools have no dependencies.
      # Only pw3-string-analyzer ships a test harness today. Add further tools here.
      - name: pw3-string-analyzer
        run: node pw3-string-analyzer/test.js
